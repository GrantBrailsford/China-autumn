<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>China &amp; Japan Trip</title>
<style>
:root{
  --ground:#F2F4F3; --surface:#FFFFFF; --ink:#15212B; --muted:#5B6770; --line:#DCE2E0;
  --jade:#1E7263; --jade-soft:#E1EFEB; --seal:#B8412E; --seal-soft:#F7E6E2; --amber:#9A6A12; --amber-soft:#F6EDD9;
  --hk:#7A4E9B; --cn:#B8412E; --jp:#2C5F8A;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Songti SC",Georgia,serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1619; --surface:#172126; --ink:#E6ECEA; --muted:#98A5A8; --line:#2A373C;
    --jade:#5CC0A9; --jade-soft:#17332D; --seal:#E97A63; --seal-soft:#3A1F1A; --amber:#E0B35A; --amber-soft:#342913;
    --hk:#B994D8; --cn:#E97A63; --jp:#7EAED8;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1619; --surface:#172126; --ink:#E6ECEA; --muted:#98A5A8; --line:#2A373C;
  --jade:#5CC0A9; --jade-soft:#17332D; --seal:#E97A63; --seal-soft:#3A1F1A; --amber:#E0B35A; --amber-soft:#342913;
  --hk:#B994D8; --cn:#E97A63; --jp:#7EAED8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
header.top{padding-block:28px 12px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:clamp(28px,7vw,40px);line-height:1.1;margin-top:6px}
.sub{color:var(--muted);margin-top:6px}
.status{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:var(--jade-soft);color:var(--jade);font-weight:600;padding:6px 12px;border-radius:999px;font-size:14px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--jade)}

/* route strip */
.route{margin-top:20px;display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;padding:0 4px}
.seg.hk{background:var(--hk)} .seg.cn{background:var(--cn)} .seg.jp{background:var(--jp)} .seg.air{background:var(--line);color:var(--muted)}
.route-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;gap:4px;padding-block:14px 10px;margin-top:10px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;font-size:14px;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ground)}
nav.tabs button:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--seal);color:#fff;font-size:11px;line-height:18px;text-align:center}

section.panel{padding-top:18px}
.stack{display:flex;flex-direction:column;gap:12px}

/* day cards */
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:58px 1fr;gap:4px 14px}
.day.today{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade-soft)}
.day.past{opacity:.6}
.date{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date .dow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.date .dnum{font-family:var(--display);font-size:28px;line-height:1.1}
.date .mon{font-size:12px;color:var(--muted)}
.day h3{font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.05em;padding:2px 7px;border-radius:4px;color:#fff}
.tag.hk{background:var(--hk)} .tag.cn{background:var(--cn)} .tag.jp{background:var(--jp)} .tag.air{background:var(--muted)}
.tag.now{background:var(--jade)}
.events{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.events li{display:grid;grid-template-columns:46px 1fr;gap:8px;font-size:14px}
.events .t{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.events .k-flight .x{font-weight:600}
.events .k-gap .x{color:var(--amber)}
.sleep{margin-top:10px;font-size:13px;color:var(--muted)}
.sleep b{color:var(--ink);font-weight:600}
.plans{margin-top:10px;padding:8px 10px;border-radius:6px;background:var(--jade-soft);font-size:14px}
.plans .lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--jade)}
.plans.empty{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.plans.empty .lbl{color:var(--muted)}

/* flight and hotel cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:19px}
.card .when{color:var(--muted);font-size:14px;margin-top:2px}
.leg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:14px}
.leg .code{font-family:var(--mono);font-size:26px;line-height:1}
.leg .tm{font-family:var(--mono);font-size:15px;margin-top:4px}
.leg .pl{font-size:12px;color:var(--muted)}
.leg .mid{text-align:center;font-size:12px;color:var(--muted)}
.leg .mid .fn{display:block;font-family:var(--mono);font-size:13px;color:var(--ink)}
.leg .arr{text-align:right}
.hop{margin-top:10px;font-size:13px;color:var(--amber);background:var(--amber-soft);padding:6px 10px;border-radius:6px}
dl.facts{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:6px 12px;margin:14px 0 0;font-size:14px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0}
.ref{font-family:var(--mono);font-size:14px;background:var(--ground);border:1px solid var(--line);border-radius:4px;padding:1px 6px;cursor:pointer;color:var(--ink)}
.ref.copied{border-color:var(--jade);color:var(--jade)}
.note{margin-top:12px;font-size:13px;padding:8px 10px;border-radius:6px;background:var(--amber-soft);color:var(--ink)}
.native{font-size:15px}
.mini{font:inherit;font-size:12px;font-weight:600;padding:2px 8px;margin-left:4px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.events .k-activity .x{color:var(--ink)}
.lock{min-height:80vh;display:flex;align-items:center;justify-content:center}
.lockbox{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:10px}
.lockh{font-size:24px;margin-bottom:6px}
.lbl2{font-size:13px;font-weight:600;color:var(--muted)}
#pw{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);width:100%}
#pw:focus-visible{outline:2px solid var(--jade);outline-offset:1px}
.remember{font-size:14px;display:flex;gap:8px;align-items:center;color:var(--muted)}
.lockbox .btn{justify-content:center;padding:10px 14px}
.err{margin:0;min-height:1.2em;font-size:14px;color:var(--seal)}
.lockout{background:transparent;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-left:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.city-h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:10px 0 -2px}

/* todo */
.todo{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--seal);border-radius:8px;padding:12px 14px}
.todo.watch{border-left-color:var(--amber)}
.todo.done{border-left-color:var(--jade);opacity:.7}
.todo h3{font-family:var(--body);font-size:15px;font-weight:600}
.todo p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-right:6px;vertical-align:1px}
.pill.book{background:var(--seal-soft);color:var(--seal)} .pill.watch{background:var(--amber-soft);color:var(--amber)} .pill.done{background:var(--jade-soft);color:var(--jade)}

footer{margin-top:32px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* driver card overlay */
.driver{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.driver .dname{font-family:var(--display);font-size:clamp(28px,8vw,52px);line-height:1.25;word-break:break-word}
.driver .daddr{font-family:var(--display);font-size:clamp(22px,6vw,38px);line-height:1.35;margin-top:18px;word-break:break-word}
.driver .deng{margin-top:18px;color:var(--muted);font-size:14px}
.driver .btn{margin-top:28px}
.qrbtn{margin-top:14px;margin-left:8px}
.qrov{position:fixed;inset:0;z-index:21;background:#fff;color:#15212B;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.qrov .eyebrow{color:#5B6770}
.qrov h2{font-size:22px;margin-top:4px;color:#15212B}
.qrov .qsub{font-size:14px;color:#5B6770;margin-top:2px}
.qrov img{display:block;width:min(88vw,62vh,520px);height:auto;margin:18px auto 10px;image-rendering:pixelated;image-rendering:crisp-edges}
.qrov .qname{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:.03em}
.qrov .qnote{font-size:13px;color:#5B6770;max-width:420px;margin-top:10px}
.qrov .qpick{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.qrov .qpick button{font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid #DCE2E0;background:#fff;color:#15212B;cursor:pointer}
.qrov .qpick button[aria-pressed="true"]{background:#15212B;color:#fff;border-color:#15212B}
.qrov .btn.primary{margin-top:18px;background:#15212B;color:#fff;border-color:#15212B}
.events .k-entry .x{font-weight:600;color:var(--jp)}
@media (prefers-reduced-motion: no-preference){ .day,.card{transition:border-color .2s} }
</style>

<div class="lock" id="lock">
  <form class="lockbox" id="lockForm" autocomplete="off">
    <div class="eyebrow">Private itinerary</div>
    <h1 class="lockh">China &amp; Japan, Autumn 2026</h1>
    <label for="pw" class="lbl2">Password</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label class="remember"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button class="btn primary" type="submit" id="unlockBtn">Unlock</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="eyebrow" id="who"></div>
    <h1>China &amp; Japan, Autumn 2026</h1>
    <div class="sub">Toronto · Hong Kong · Shenzhen · Zhangjiajie · Shanghai · Tokyo · Hakone<br>Tue Oct 13 to Mon Nov 2</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText"></span></div><button class="btn qrbtn" id="qrTop" data-qr="0" hidden>Japan entry QR</button>
    <div class="route" id="route" aria-hidden="true"></div>
    <div class="route-legend"><span>Oct 13</span><span>Oct 23</span><span>Nov 2</span></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Itinerary sections">
    <button role="tab" id="tab-days" aria-controls="p-days" aria-selected="true">Day by day</button>
    <button role="tab" id="tab-flights" aria-controls="p-flights" aria-selected="false">Flights</button>
    <button role="tab" id="tab-hotels" aria-controls="p-hotels" aria-selected="false">Hotels</button>
    <button role="tab" id="tab-todo" aria-controls="p-todo" aria-selected="false">To do<span class="badge" id="todoCount"></span></button>
  </nav>

  <section class="panel" id="p-days" role="tabpanel" aria-labelledby="tab-days"><div class="stack" id="days"></div></section>
  <section class="panel" id="p-flights" role="tabpanel" aria-labelledby="tab-flights" hidden><div class="stack" id="flights"></div></section>
  <section class="panel" id="p-hotels" role="tabpanel" aria-labelledby="tab-hotels" hidden><div class="stack" id="hotels"></div></section>
  <section class="panel" id="p-todo" role="tabpanel" aria-labelledby="tab-todo" hidden><div class="stack" id="todos"></div></section>

  <footer id="foot"></footer>
</div>

<div class="driver" id="driver" hidden role="dialog" aria-modal="true" aria-labelledby="dname">
  <div class="eyebrow" id="dlabel">Please take us to</div>
  <div class="dname" id="dname"></div>
  <div class="daddr" id="daddr"></div>
  <div class="deng" id="deng"></div>
  <button class="btn primary" id="dclose">Close</button>
</div>

<div class="qrov" id="qrov" hidden role="dialog" aria-modal="true" aria-labelledby="qtitle">
  <div class="eyebrow">Japan arrival · Haneda</div>
  <h2 id="qtitle"></h2>
  <div class="qsub" id="qsub"></div>
  <div class="qpick" id="qpick"></div>
  <img id="qimg" alt="Visit Japan Web QR code">
  <div class="qname" id="qname"></div>
  <div class="qnote" id="qnote"></div>
  <button class="btn primary" id="qclose">Close</button>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let hotelById = {};
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const countryName = {hk:"Hong Kong", cn:"China", jp:"Japan", air:"In transit"};

function parseDay(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function todayKey(){ const t = new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }

function renderStatus(){
  const today = todayKey(), first = TRIP.days[0].date, last = TRIP.days[TRIP.days.length-1].date;
  const ms = 86400000, diff = Math.round((parseDay(first) - parseDay(today)) / ms);
  let txt;
  if (today < first) txt = diff === 1 ? "We leave tomorrow" : diff + " days until we leave";
  else if (today > last) txt = "Trip complete. Welcome home.";
  else { const i = TRIP.days.findIndex(d => d.date === today); txt = "Day " + (i+1) + " of " + TRIP.days.length + " · " + TRIP.days[i].place; }
  $("#statusText").textContent = txt;
}

function renderRoute(){
  let html = "";
  let cur = null, n = 0;
  const segs = [];
  TRIP.days.forEach(d => { if (d.c === cur) n++; else { if (cur) segs.push([cur,n]); cur = d.c; n = 1; } });
  segs.push([cur,n]);
  segs.forEach(([c,k]) => { html += '<div class="seg '+c+'" style="flex:'+k+'">'+(k>=4 ? countryName[c] : (c==="hk" ? "HK" : ""))+'</div>'; });
  $("#route").innerHTML = html;
}

function renderDays(){
  const today = todayKey();
  $("#days").innerHTML = TRIP.days.map(d => {
    const dt = parseDay(d.date);
    const cls = d.date === today ? " today" : (d.date < today && today <= TRIP.days[TRIP.days.length-1].date ? " past" : "");
    const sleepH = hotelById[d.sleep];
    const sleep = sleepH ? 'Sleeping at <b>'+esc(sleepH.name)+'</b>' : '<b>'+esc(d.sleep)+'</b>';
    const ev = d.ev.length ? '<ul class="events">'+d.ev.map(([t,k,x,pid]) => '<li class="k-'+k+'"><span class="t">'+esc(t)+'</span><span class="x">'+esc(x)+(pid === "qr" && TRIP.entry ? ' <button class="mini" data-qr="0">Show QR code</button>' : (pid && hotelById[pid] ? ' <button class="mini" data-driver="'+pid+'">Show to driver</button>' : ''))+'</span></li>').join("")+'</ul>' : "";
    const plans = d.plans ? '<div class="plans"><div class="lbl">Plans</div>'+esc(d.plans)+'</div>' : '<div class="plans empty"><div class="lbl">Plans</div>Nothing planned yet</div>';
    return '<article class="day'+cls+'" id="d-'+d.date+'">'
      + '<div class="date"><div class="dow">'+DOW[dt.getDay()]+'</div><div class="dnum">'+dt.getDate()+'</div><div class="mon">'+MON[dt.getMonth()]+'</div></div>'
      + '<div><h3>'+esc(d.place)+(d.date===today?' <span class="tag now">Today</span>':'')+'</h3>'+ev
      + '<div class="sleep">'+sleep+'</div>'+plans+'</div></article>';
  }).join("");
}

function refBtn(v){ return '<button class="ref" data-copy="'+esc(v)+'" title="Tap to copy">'+esc(v)+'</button>'; }

function renderFlights(){
  $("#flights").innerHTML = TRIP.flights.map(f => {
    const legs = f.legs.map(l => '<div class="leg"><div><div class="code">'+l.from+'</div><div class="tm">'+l.dep+' · '+l.depDate+'</div><div class="pl">'+esc(l.fromName)+'</div></div>'
      + '<div class="mid"><span class="fn">'+l.fn+'</span>'+l.dur+'</div>'
      + '<div class="arr"><div class="code">'+l.to+'</div><div class="tm">'+l.arr+' · '+l.arrDate+'</div><div class="pl">'+esc(l.toName)+'</div></div></div>').join("");
    const facts = '<dl class="facts">'+f.facts.map(([k,v,t]) => '<dt>'+esc(k)+'</dt><dd>'+(t==="ref"? refBtn(v) : esc(v))+'</dd>').join("")+'</dl>';
    return '<article class="card"><h3>'+esc(f.title)+'</h3><div class="when">'+esc(f.when)+'</div>'+legs
      + (f.hop? '<div class="hop">'+esc(f.hop)+'</div>':'') + facts + (f.note? '<div class="note">'+esc(f.note)+'</div>':'') + (f.qr && TRIP.entry ? '<div class="actions"><button class="btn primary" data-qr="0">Show Japan entry QR</button></div>' : '') + '</article>';
  }).join("");
}

function renderHotels(){
  $("#hotels").innerHTML = TRIP.hotels.map(h => {
    const rows = [["Check in",h.checkIn],["Check out",h.checkOut],["Nights",String(h.nights)],["Address",h.addr],["Local",h.nativeAddr],["Room",h.room],["Payment",h.pay]];
    if (h.cancel) rows.push(["Cancel by",h.cancel]);
    const refs = h.refs.map(([k,v]) => '<dt>'+esc(k)+' ref</dt><dd>'+refBtn(v)+'</dd>').join("");
    return '<div class="city-h">'+esc(h.city)+'</div><article class="card" id="h-'+h.id+'"><h3>'+esc(h.name)+'</h3><div class="when native">'+esc(h.native)+'</div>'
      + '<dl class="facts">'+rows.map(([k,v]) => '<dt>'+esc(k)+'</dt><dd'+(k==="Local"?' class="native"':'')+'>'+esc(v)+'</dd>').join("")+refs+'</dl>'
      + (h.extra? '<div class="note">'+esc(h.extra)+'</div>':'')
      + '<div class="actions"><button class="btn primary" data-driver="'+h.id+'">Show to driver</button><a class="btn" href="tel:'+h.phone.replace(/\s/g,"")+'">Call '+esc(h.phone)+'</a></div></article>';
  }).join("");
}

function renderTodos(){
  const label = {book:"To book", watch:"Check", done:"Done"};
  const order = {book:0, watch:1, done:2};
  const list = TRIP.todos.slice().sort((a,b) => order[a.status]-order[b.status]);
  $("#todos").innerHTML = list.map(t => '<div class="todo '+t.status+'"><h3><span class="pill '+t.status+'">'+label[t.status]+'</span>'+esc(t.title)+'</h3><p>'+esc(t.detail)+'</p></div>').join("");
  const open = TRIP.todos.filter(t => t.status !== "done").length;
  $("#todoCount").textContent = open || "";
  $("#todoCount").hidden = !open;
}

function openDriver(id){
  const h = hotelById[id]; if (!h) return;
  $("#dlabel").textContent = h.country === "jp" ? "ここへお願いします · Please take us to" : (h.country === "hk" ? "請帶我們去 · Please take us to" : "请带我们去 · Please take us to");
  $("#dname").textContent = h.native;
  $("#daddr").textContent = h.nativeAddr;
  $("#deng").textContent = [h.name, h.addr, h.phone].filter(Boolean).join(" · ");
  $("#driver").hidden = false;
  $("#dclose").focus();
}

function openQR(i){
  const E = TRIP && TRIP.entry; if (!E || !E.people.length) return;
  i = Math.max(0, Math.min(E.people.length-1, Number(i)||0));
  const p = E.people[i];
  $("#qtitle").textContent = E.title; $("#qsub").textContent = E.sub || "";
  $("#qimg").src = p.img; $("#qname").textContent = p.name; $("#qnote").textContent = E.note || "";
  $("#qpick").innerHTML = E.people.length > 1 ? E.people.map((q,k) => '<button data-qr="'+k+'" aria-pressed="'+(k===i)+'">'+esc(q.name)+'</button>').join("") : "";
  $("#qrov").hidden = false; $("#qclose").focus();
}

function selectTab(id){
  document.querySelectorAll('nav.tabs [role="tab"]').forEach(b => {
    const on = b.id === id;
    b.setAttribute("aria-selected", on);
    document.getElementById(b.getAttribute("aria-controls")).hidden = !on;
  });
  try { localStorage.setItem("tripTab", id); } catch(e){}
}

document.addEventListener("click", e => {
  const tab = e.target.closest('[role="tab"]'); if (tab) { selectTab(tab.id); return; }
  const d = e.target.closest("[data-driver]"); if (d) { openDriver(d.dataset.driver); return; }
  const q = e.target.closest("[data-qr]"); if (q) { openQR(q.dataset.qr); return; }
  const c = e.target.closest("[data-copy]");
  if (c) {
    const done = () => { c.classList.add("copied"); const o = c.textContent; c.textContent = "Copied"; setTimeout(() => { c.textContent = o; c.classList.remove("copied"); }, 1200); };
    try { navigator.clipboard.writeText(c.dataset.copy).then(done, () => {}); } catch(err){}
  }
});
$("#dclose").addEventListener("click", () => { $("#driver").hidden = true; });
$("#qclose").addEventListener("click", () => { $("#qrov").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("#driver").hidden = true; $("#qrov").hidden = true; } });

function show(){
  hotelById = Object.fromEntries(TRIP.hotels.concat(TRIP.places || []).map(h => [h.id, h]));
  $("#who").textContent = TRIP.travellers || "";
  $("#qrTop").hidden = !TRIP.entry;
  renderStatus(); renderRoute(); renderDays(); renderFlights(); renderHotels(); renderTodos();
  $("#foot").innerHTML = "Last updated " + esc(TRIP.updated) + ". Ask Claude to add or change details. All times are local. <button class='lockout' id='lockout'>Lock and forget on this device</button>";
  $("#lock").hidden = true; $("#app").hidden = false;
  try { const t = localStorage.getItem("tripTab"); if (t && document.getElementById(t)) selectTab(t); } catch(e){}
  const td = document.getElementById("d-" + todayKey()); if (td && !document.querySelector('#p-days[hidden]')) td.scrollIntoView({block:"center"});
}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SEALED.salt), iterations:SEALED.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function openWith(key){
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(SEALED.iv)}, key, b64(SEALED.ct));
  TRIP = JSON.parse(new TextDecoder().decode(plain));
}
const STORE = "tripKey:" + SEALED.salt;
async function tryRemembered(){
  let jwk = null;
  try { jwk = JSON.parse(localStorage.getItem(STORE) || "null"); } catch(e){}
  if (!jwk) return false;
  try { const key = await crypto.subtle.importKey("jwk", jwk, {name:"AES-GCM"}, true, ["decrypt"]); await openWith(key); return true; }
  catch(e){ try { localStorage.removeItem(STORE); } catch(_){} return false; }
}
$("#lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#unlockBtn"); btn.disabled = true; btn.textContent = "Unlocking…"; $("#err").textContent = "";
  try {
    if (!(window.crypto && crypto.subtle)) throw new Error("nocrypto");
    const key = await deriveKey($("#pw").value.trim());
    await openWith(key);
    if ($("#remember").checked) { try { localStorage.setItem(STORE, JSON.stringify(await crypto.subtle.exportKey("jwk", key))); } catch(_){} }
    $("#pw").value = ""; show();
  } catch(err){
    $("#err").textContent = err && err.message === "nocrypto" ? "This browser can't unlock the page. Try Safari or Chrome." : "That password didn't work. Check the spelling and try again.";
  }
  btn.disabled = false; btn.textContent = "Unlock";
});
document.addEventListener("click", e => {
  if (e.target.id === "lockout") { try { localStorage.removeItem(STORE); } catch(_){} TRIP = null; $("#qrov").hidden = true; $("#app").hidden = true; $("#lock").hidden = false; $("#pw").focus(); }
});
(async () => { if (window.crypto && crypto.subtle && await tryRemembered()) show(); else $("#pw").focus(); })();
</script>
